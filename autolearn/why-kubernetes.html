<title>Why Kubernetes Exists</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<!-- AutoLearn part 1 mini module (Oct 24-28 2026). v10: public copy on github.io reaches Claude through Aneesh's relay (RELAY below); inside claude.ai nothing changes. v9: pictures show on their own when they should help (a process or structure card AND the idea is new to you, or you just struggled, or energy is low, or you paused 25 s on a card); otherwise behind the button. ?pics=random flips a coin per card for testing. v8: after the warm-up, a short animation of what Kube heard (bars rise a little, never all the way). Feedback says exactly what you got and what's missing, each highlight has a short reason; checks are judged against what the question asks. Opening a branch zooms into it: the box becomes the focus, the rest shrinks to a row of small pills. v7: less on screen. A side question opens as just the question; its branches appear only after a guess or "Just show me", and you pick one. New words go quietly into a word bank (no pop-ups, no word strip). Pictures only on "Show me a picture" (try-its keep theirs). Redrawn want/look/fix loop. v6: back button on the big picture, a clearer thermostat picture, your answer highlighted (green right, yellow mixed up, red wrong) with fewer words, multiple choice mixed in (a right pick still asks why), and Kube's tips in the corner are off (KUBE_TIPS). v5: keys first, then warm-up or straight to learning; several questions to start; Kube's read of your energy (shown, and it decides how many extras Kube offers); side questions ask before a guess, and your answer sits in the middle with the questions branching out; word checks for fuzzy definitions; follow-ups offered, never forced. v4: Kube's read now steers the lesson (misconceptions first, lowest confidence next, fixes offered on the spot), and a right answer isn't proof: three levels (said it, applied it, explained why) cap the confidence. v3: the side-by-side is always shown (group A is the default; narrow screens get a top strip). v2 added Kube's live read of what the learner understands (an A/B experiment, data saved per run).
     v1: One part only: why Kubernetes exists.
     Flow: a short talk (what do you know?) -> the ship picture -> a map that grows from what you know ->
     each side question opens its own small map of diagrams -> teach it back. Keyboard only: arrows + Enter. -->
<style>
:root{
  --ground:#EDF0EC;--surface:#FFFFFF;--surface-2:#F5F7F4;--ink:#18201C;--muted:#5B6660;--line:#D6DCD6;--ghost:#9AA59E;
  --accent:#1E6B50;--accent-ink:#FFFFFF;--accent-soft:#DCEBE3;--branch:#B7800F;--branch-soft:#F5E7C6;--wrong:#B4442F;--wrong-soft:#F6DDD6;
  --sea:#D7E6EA;--sea-2:#C3D9DF;--sea-ink:#2D5D6B;--hull:#6B4A2E;--hull-soft:#E9DCCB;
  --shadow:0 1px 2px rgba(24,32,28,.06),0 12px 32px -12px rgba(24,32,28,.22);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;--ground:#121714;--surface:#1A211D;--surface-2:#202823;--ink:#E6ECE8;--muted:#98A59E;--line:#2E3832;--ghost:#5E6B64;
    --accent:#5FBF95;--accent-ink:#0E1A14;--accent-soft:#1F3A2E;--branch:#E0A93A;--branch-soft:#3A2F17;--wrong:#E5826C;--wrong-soft:#3B221C;
    --sea:#14262B;--sea-2:#1A3138;--sea-ink:#8FC3D1;--hull:#C9A27A;--hull-soft:#33281D;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;--ground:#121714;--surface:#1A211D;--surface-2:#202823;--ink:#E6ECE8;--muted:#98A59E;--line:#2E3832;--ghost:#5E6B64;
  --accent:#5FBF95;--accent-ink:#0E1A14;--accent-soft:#1F3A2E;--branch:#E0A93A;--branch-soft:#3A2F17;--wrong:#E5826C;--wrong-soft:#3B221C;
  --sea:#14262B;--sea-2:#1A3138;--sea-ink:#8FC3D1;--hull:#C9A27A;--hull-soft:#33281D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.02em;margin:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:500;font-size:17px;padding:11px 20px;box-shadow:var(--shadow)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)}
.screen{min-height:100vh;padding:24px 16px 120px}
@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes growS{from{opacity:0;scale:.4}to{opacity:1;scale:1}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--branch) 55%,transparent)}50%{box-shadow:0 0 0 10px transparent}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}

/* keyboard ring: Kube's pointer */
.kf{outline:3px solid var(--branch)!important;outline-offset:3px;border-radius:12px}
.btn.kf,.chip.kf{border-radius:999px}
.keys{position:fixed;right:14px;bottom:12px;z-index:60;font:500 12px/1 var(--mono);color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 11px}
.keys kbd{font:inherit;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;margin:0 1px;background:var(--surface-2)}
@media (hover:none){.keys{display:none}}

/* Kube */
.face svg{width:100%;height:100%;display:block}
.bf-head{fill:var(--branch-soft);stroke:var(--branch);stroke-width:2.2}
.bf-hair{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.bf-eye{fill:var(--ink)}
.bf-eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.bf-line{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.bf-cheek{fill:var(--wrong);opacity:.22}
.bf-happy,.bf-huh,.bf-open{display:none}
.face-happy .bf-eyes,.face-happy .bf-smile{display:none}.face-happy .bf-happy{display:inline}
.face-talk .bf-smile{display:none}.face-talk .bf-open{display:inline;fill:var(--ink)}
.kube{position:fixed;left:14px;bottom:14px;z-index:70;display:flex;align-items:flex-end;gap:10px;max-width:min(460px,calc(100vw - 28px));pointer-events:none}
.kube .face{width:58px;height:58px;flex:none;animation:bob 3s ease-in-out infinite;pointer-events:auto}
.kube-b{pointer-events:auto;background:var(--surface);border:1.5px solid var(--branch);border-radius:16px 16px 16px 4px;padding:10px 14px;box-shadow:var(--shadow);font-size:16px;line-height:1.35;animation:appear .25s both}
.kube-b .row{margin-top:8px}
.kube-b .btn{font-size:15px;padding:7px 14px}

/* start */
.start{display:grid;place-items:center;text-align:center}
.start-in{max-width:560px;animation:appear .4s both}
.start h1{font-size:clamp(34px,6vw,52px);line-height:1.05;margin:10px 0 12px}
.start .face{width:84px;height:84px;margin:0 auto}
.meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:6px 0 26px}
.pill{font:500 13px/1 var(--mono);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 11px;color:var(--muted)}

/* talk */
.talk{display:grid;place-items:start center}
.talk-card{width:min(680px,100%);margin-top:4vh;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:20px}
.talk-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.talk-top .face{width:52px;height:52px;flex:none}
.talk-top b{font-family:var(--display);font-size:20px;display:block}
.prog{margin-left:auto;font:500 12.5px/1 var(--mono);color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap}
.dots{display:flex;gap:4px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots i.done{background:var(--accent)}.dots i.on{background:var(--branch)}
.log{display:grid;gap:8px;margin-bottom:12px}
.msg{padding:10px 14px;border-radius:14px;max-width:88%;animation:appear .25s both}
.msg.kube-m{background:var(--surface-2);border:1px solid var(--line);font-family:var(--display);font-size:19px;line-height:1.3}
.msg.you{justify-self:end;background:var(--accent-soft);font-size:16px}
.answer{display:flex;gap:8px;align-items:stretch}
.answer textarea{flex:1;min-height:64px;resize:vertical;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2);font-size:17px}
.answer textarea:focus{outline:none;border-color:var(--accent)}
.mic{border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:12px;padding:0 12px;font:500 14px var(--display)}
.mic.on{background:var(--wrong);border-color:var(--wrong);color:#fff}
.answer+.row{margin-top:10px}
.thinking{color:var(--muted);font-family:var(--mono);font-size:13px}

/* the ship picture (intro) */
.ship-scr{display:grid;place-items:start center}
.ship-card{width:min(860px,100%);margin-top:2vh;text-align:center}
.ship-stage{background:linear-gradient(var(--surface) 0 58%,var(--sea) 58% 100%);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.ship-stage svg{display:block;width:100%;height:auto}
.ship-line{font-family:var(--display);font-size:clamp(22px,3.6vw,32px);line-height:1.2;margin:18px auto 6px;max-width:640px;min-height:2.4em;animation:appear .35s both}
.beat-dots{display:flex;justify-content:center;gap:6px;margin:6px 0 16px}.beat-dots i{width:26px;height:5px;border-radius:3px;background:var(--line)}.beat-dots i.on{background:var(--accent)}

/* map */
.map-scr{padding-top:16px;background:radial-gradient(ellipse at 50% 120%,var(--sea-2),transparent 60%),var(--ground)}
.map-top{max-width:1000px;margin:0 auto 10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.map-top h2{font-size:22px}
.bar{flex:1;min-width:140px;max-width:260px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);transition:width .6s}
.map{position:relative;max-width:1000px;margin:0 auto;aspect-ratio:1000/640}
.map svg.ropes{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.rope{stroke:var(--sea-ink);stroke-width:2;stroke-dasharray:2 7;stroke-linecap:round;fill:none;opacity:.5;animation:appear .5s both}
.chain{stroke:var(--accent);stroke-width:2.2;fill:none;animation:appear .5s both}
.chain.faint{stroke:var(--ghost);stroke-dasharray:5 6}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(32%,340px);text-align:center;border:0;background:none;padding:0}
.center .hull{background:var(--hull-soft);border:2px solid var(--hull);border-radius:16px 16px 60px 60px;padding:14px 16px 22px;box-shadow:var(--shadow)}
.center svg{width:46px;height:46px;display:block;margin:0 auto 4px}
.center b{font-family:var(--display);font-size:clamp(16px,2vw,21px);line-height:1.2;display:block}
.center small{display:block;font:500 12px/1.3 var(--mono);color:var(--muted);margin-top:6px}
.node{position:absolute;transform:translate(-50%,-50%);width:min(25%,240px);text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);animation:growS .5s both}
.node .n{font:500 12px/1 var(--mono);color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-bottom:5px}
.node b{font-family:var(--display);font-weight:500;font-size:clamp(15px,1.7vw,18px);line-height:1.2;display:block}
.node.known,.node.done{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 70%,var(--surface))}
.node.known .n,.node.done .n{color:var(--accent)}
.node em{display:block;font-size:13px;color:var(--muted);margin-top:4px;line-height:1.3}
.node.rec{animation:growS .5s both,pulse 2s 1s infinite}
.more-hint{position:absolute;left:50%;bottom:0;transform:translateX(-50%);font:500 12.5px/1.3 var(--mono);color:var(--muted);text-align:center;width:90%}
@media (max-width:700px){
  .map{aspect-ratio:auto;display:grid;gap:12px}
  .map svg.ropes{display:none}
  .center,.node{position:static;transform:none;width:100%}
  .center{order:-1}
  .more-hint{position:static;transform:none;width:100%}
}

/* a side question's own small map */
.sub{position:fixed;inset:0;z-index:50;background:var(--ground);overflow:auto;padding:16px 16px 130px;animation:appear .3s both}
.sub-in{max-width:980px;margin:0 auto}
.sub-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sub-top .btn{font-size:15px;padding:7px 14px}
.sub-q{flex:1;min-width:220px}
.sub-q h2{font-size:clamp(22px,3vw,30px);line-height:1.15}
.sub-grid{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
@media (max-width:760px){.sub-grid{grid-template-columns:1fr}}
.minimap{position:relative;display:grid;gap:10px;padding-left:18px}
.minimap::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;border-left:2px dashed var(--line)}
.chip{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;font-family:var(--display);font-size:16px;line-height:1.25;animation:grow .4s both}
.chip::before{content:"";position:absolute;left:-17px;top:50%;width:14px;border-top:2px dashed var(--line)}
.chip.seen{border-color:var(--accent)}
.chip.seen::after{content:"✓";position:absolute;right:10px;top:8px;color:var(--accent);font-size:14px}
.chip.on{background:var(--accent-soft);border-color:var(--accent)}
.chip.check{border-style:dashed;border-color:var(--branch);color:var(--branch)}
.chip.rec{animation:grow .4s both,pulse 2s .8s infinite}
.chip small{display:block;font:500 11.5px/1.2 var(--mono);color:var(--muted);margin-top:3px}
.guess{font-size:14px;color:var(--muted);border-left:3px solid var(--branch);padding:4px 10px;margin:4px 0 8px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;min-height:380px}
.stage .pic{background:var(--surface-2);border-radius:12px;overflow:hidden}
.stage .pic svg{display:block;width:100%;height:auto;max-height:52vh}
.lines{margin-top:12px;display:grid;gap:6px}
.line{font-family:var(--display);font-size:clamp(19px,2.4vw,23px);line-height:1.3;animation:appear .35s both}
.line.small{font-family:var(--serif);font-size:17px;color:var(--muted)}
.stage .row{margin-top:12px}
.empty{display:grid;place-items:center;min-height:340px;text-align:center;color:var(--muted)}
.empty .face{width:64px;height:64px;margin:0 auto 8px}
.words{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;align-items:center}
.words span.l{font:500 12px/1 var(--mono);color:var(--muted)}
.word{border:1px solid var(--branch);background:var(--branch-soft);color:var(--ink);border-radius:999px;padding:4px 10px;font:500 13px var(--display)}
.verdict{font-family:var(--display);font-size:20px;margin:10px 0 2px}
.verdict.ok{color:var(--accent)}.verdict.no{color:var(--wrong)}
.sub .answer textarea{min-height:56px}

/* new word card */
.wordcard{position:fixed;right:16px;top:16px;z-index:80;width:min(320px,calc(100vw - 32px));background:var(--surface);border:2px solid var(--branch);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;animation:grow .35s both}
.wordcard .eyebrow{color:var(--branch)}
.wordcard h3{font-size:24px;margin:2px 0 4px}
.wordcard svg{display:block;width:100%;height:auto;max-height:110px;margin:6px 0}
.wordcard p{margin:0;font-size:16px;line-height:1.35}
.wordcard .btn{margin-top:10px;font-size:14px;padding:6px 14px}

/* teach back + end */
.teach{display:grid;place-items:start center}
.teach-card{width:min(720px,100%);margin-top:3vh;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:20px}
.teach-card h2{font-size:clamp(24px,3.4vw,32px);line-height:1.15;margin:6px 0 12px}
.got{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
@media (max-width:560px){.got{grid-template-columns:1fr 1fr}}
.got div{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;font-family:var(--display);font-size:14.5px;line-height:1.2;animation:grow .35s both}
.got div.y{border-color:var(--accent);background:var(--accent-soft)}
.got div.n{border-color:var(--wrong);border-style:dashed}
.got div i{display:block;font:500 11px/1 var(--mono);font-style:normal;color:var(--muted);margin-bottom:4px}

/* diagram pieces */
.d-t{font-family:var(--display);fill:var(--ink)}
.d-m{font-family:var(--mono);fill:var(--muted)}
.d-box{fill:var(--branch-soft);stroke:var(--branch);stroke-width:2}
.d-box.g{fill:var(--accent-soft);stroke:var(--accent)}
.d-box.r{fill:var(--wrong-soft);stroke:var(--wrong)}
.d-box.x{fill:var(--surface-2);stroke:var(--ghost)}
.d-srv{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.d-ln{stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.d-q{stroke:var(--muted);stroke-width:1.6;fill:none;stroke-dasharray:4 5}
.d-ok{fill:var(--accent)}.d-bad{fill:var(--wrong)}
.d-sea{fill:var(--sea)}.d-hull{fill:var(--hull-soft);stroke:var(--hull);stroke-width:2.5}
.d-user{fill:var(--sea-ink)}
.pop{animation:grow .45s both;transform-box:fill-box;transform-origin:center}
.fade{animation:appear .45s both}
@keyframes flow{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(var(--dx,120px));opacity:0}}
.flow{animation:flow 2.4s linear infinite}
.stop .flow{animation-play-state:paused;fill:var(--wrong)}
@keyframes sink{to{transform:translateY(26px) rotate(8deg);opacity:.35}}
.sink{animation:sink 1.4s .2s both;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
.buzz{animation:shake .3s 6;transform-box:fill-box;transform-origin:center}
.zz{animation:appear 1.2s infinite alternate}
@keyframes slide{from{transform:translate(var(--sx,0),var(--sy,0))}to{transform:none}}
.slide{animation:slide .9s ease-in-out both}
/* v2: Kube's read of what you understand (group A sees it live; group B only at the end) */
.grp{position:fixed;right:14px;top:12px;z-index:65;font:500 11.5px/1 var(--mono);border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 10px}
.read{position:fixed;top:0;bottom:0;width:260px;z-index:55;background:var(--surface);border:0 solid var(--line);overflow:auto;padding:16px 14px 90px;font-size:14.5px;line-height:1.35}
.read.l{left:0;border-right-width:1px}.read.r{right:0;border-left-width:1px}
.read h3{font-size:15px;margin:0 0 4px}
.read .rsub{font:500 11px/1.3 var(--mono);color:var(--muted);margin:0 0 10px}
.read ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.read li{border-left:3px solid var(--accent);padding:2px 0 2px 9px;animation:appear .4s both}
.read.r li{border-color:var(--branch)}.read.r li.mis{border-color:var(--wrong)}
.read li b{display:block;font:500 10.5px/1.2 var(--mono);color:var(--muted);margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em}
.read li.mis b{color:var(--wrong)}
.read li em{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}

// ---------- Claude (inside claude.ai), with a word-matching fallback everywhere ----------
let samplePromise = null;

  if (!samplePromise) samplePromise = window.claude && typeof window.claude.use === "function" ? Promise.resolve(window.claude.use("sample")).catch(() => null) : Promise.resolve(null);

const RELAY = "https://kube-relay.REPLACE_ME.workers.dev/ask";
const relayOn = () => !/REPLACE_ME/.test(RELAY) && !(window.claude && typeof window.claude.use === "function");
function parseJson(t) {
  t = String(t || "").replace(/^```(?:json)?\s*|\s*```$/g, "").trim();
  try { return JSON.parse(t); } catch (e) {}
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  try { return a >= 0 && b > a ? JSON.parse(t.slice(a, b + 1)) : null; } catch (e) { return null; }

  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 20000);

  if (relayOn()) return askRelay(prompt);
  try {
    const sm = await getSample(); if (!sm || typeof sm.json !== "function") return null;
    return await Promise.race([sm.json(prompt, { modelTier: "default" }), new Promise((ok) => setTimeout(() => ok(null), 12000))]);

// ---------- the content: six ideas, each a side question with its own small map ----------

function markAnswer(text, marks) {
  const t = String(text), lo = t.toLowerCase(), R = [];
  (Array.isArray(marks) ? marks : []).forEach((m) => {
    const k = m && { right: "right", mixed: "mixed", wrong: "wrong" }[m.kind]; if (!k || !m.text) return;
    const i = lo.indexOf(String(m.text).toLowerCase()); if (i < 0) return; const e = i + String(m.text).length;
    if (!R.some((r) => i < r.e && e > r.s)) R.push({ s: i, e, k });
  });
  R.sort((a, b) => a.s - b.s); let o = "", p = 0;
  R.forEach((r) => { o += esc(t.slice(p, r.s)) + `<mark class="m-${r.k}">${esc(t.slice(r.s, r.e))}</mark>`; p = r.e; });
  return o + esc(t.slice(p));
}

const KB = { cur: null };
const layer = () => !$("read-pop").hidden ? $("read-pop") : !$("drill").hidden ? $("drill") : !$("wordcard").hidden ? $("wordcard") : !$("sub").hidden ? $("sub") : document.querySelector(".screen:not([hidden])");
function targets() {
  const L = layer(), list = [...L.querySelectorAll("[data-k]")];

}
function ring(el, scroll = true) {
  document.querySelectorAll(".kf").forEach((e) => e.classList.remove("kf"));
  KB.cur = el || null; if (!el) return;
  el.classList.add("kf");
  if (el.tagName === "TEXTAREA" && innerWidth > 700) el.focus({ preventScroll: true });
  else if (document.activeElement && document.activeElement.tagName === "TEXTAREA" && document.activeElement !== el) document.activeElement.blur();
  if (scroll) { const r = el.getBoundingClientRect(); if (r.top < 60 || r.bottom > innerHeight - 90) el.scrollIntoView({ block: "center", behavior: "smooth" }); }
}
function ringDefault() {
  const t = targets(); if (!t.length) return ring(null);
  if (KB.cur && t.includes(KB.cur)) return ring(KB.cur, false);
  ring(t.find((e) => e.matches("[data-rec], .rec")) || t.find((e) => e.tagName === "TEXTAREA") || t[0]);
}
function move(dir) {
  const t = targets(); if (!t.length) return;
  if (!KB.cur || !t.includes(KB.cur)) return ringDefault();
  const a = KB.cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best = null, bs = Infinity;
  t.forEach((e) => {
    if (e === KB.cur) return;
    const b = e.getBoundingClientRect(), bx = b.left + b.width / 2, by = b.top + b.height / 2, dx = bx - ax, dy = by - ay;
    const along = dir === "ArrowRight" ? dx : dir === "ArrowLeft" ? -dx : dir === "ArrowDown" ? dy : -dy;
    const across = dir === "ArrowRight" || dir === "ArrowLeft" ? Math.abs(dy) : Math.min(Math.abs(dx), Math.abs(b.left - a.left));
    if (along <= 4) return;
    const sc = along + across * 2; if (sc < bs) { bs = sc; best = e; }
  });
  if (best && (dir === "ArrowDown" || dir === "ArrowUp")) { // up/down: land on the nearest row, at its left end
    const by = (e) => { const r = e.getBoundingClientRect(); return r.top + r.height / 2; }, row = by(best);
    best = t.filter((e) => e !== KB.cur && Math.abs(by(e) - row) < 12).sort((p, q) => p.getBoundingClientRect().left - q.getBoundingClientRect().left)[0] || best;
  }
  if (!best) { const i = t.indexOf(KB.cur), step = dir === "ArrowRight" || dir === "ArrowDown" ? 1 : -1; best = t[(i + step + t.length) % t.length]; }
  ring(best);
}
document.addEventListener("keydown", (e) => {
  lastAct = Date.now(); act();
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const ae = document.activeElement, typing = ae && ae.tagName === "TEXTAREA";
  if (typing) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); const send = ae.closest("[data-form]").querySelector("[data-send]"); if (ae.value.trim() && send) send.click(); return; }
    if (e.key === "Escape" || (e.key === "ArrowDown" && !ae.value) || (e.key === "ArrowUp" && !ae.value)) { e.preventDefault(); ae.blur(); move(e.key === "ArrowUp" ? "ArrowUp" : "ArrowDown"); }
    return;
  }
  if (e.key.startsWith("Arrow")) { e.preventDefault(); move(e.key); return; }
  if (e.key === "Enter" || e.key === " ") {
    if (!KB.cur || !targets().includes(KB.cur)) { e.preventDefault(); return ringDefault(); }
    e.preventDefault(); if (KB.cur.tagName === "TEXTAREA") KB.cur.focus(); else KB.cur.click(); return;
  }

function wireAnswer(root, onSend) {

let rec = null;

function talkPrompt() {
  return `You are Kube, a friendly tutor. Before teaching part 1 of Kubernetes ("why Kubernetes exists"), you're finding out what a beginner already knows. Don't teach or correct yet.

${IDEAS.map((x) => `${x.id}: ${x.teach}`).join("\n")}

${S.turns.map((t) => `${t.who === "kube" ? "Kube" : "Learner"}: ${t.text}`).join("\n")}

    document.documentElement.style.setProperty("--stripH", $("read-strip").offsetHeight + "px");
  }
  if (prev && live() && !wide && S.read && S.read.overall !== prev.overall) { $("read-btn").classList.remove("flash"); void $("read-btn").offsetWidth; $("read-btn").classList.add("flash"); }
}
function openReadPop() {
  const c = readCols(S.read); log("read-open");
  $("read-pop").hidden = false;
  $("read-pop").innerHTML = `<div class="read-pop-in"><div class="read">${c.left}</div><div class="read r">${c.right}</div><div class="row"><button class="btn" data-k id="read-close" data-rec>Close</button></div></div>`;
  $("read-close").addEventListener("click", () => { $("read-pop").hidden = true; KB.cur = null; ringDefault(); });
}
$("read-btn").addEventListener("click", openReadPop); $("read-strip").addEventListener("click", openReadPop);
addEventListener("resize", () => renderRead());
document.addEventListener("keydown", (e) => { if ((e.key === "r" || e.key === "R") && live() && document.activeElement.tagName !== "TEXTAREA" && (!$("read-strip").hidden || document.body.classList.contains("reading"))) { e.preventDefault(); $("read-pop").hidden ? openReadPop() : $("read-close").click(); } });
function grpPill() { $("grp").textContent = `Group ${S.group.toUpperCase()} · ${live() ? "live read" : "read at the end"}`; }
$("grp").addEventListener("click", () => { S.group = live() ? "b" : "a"; S.groupFrom = "switched"; log("group-switch", { group: S.group }); grpPill(); renderRead(); });
grpPill();
// show/hide the panels on every screen change
const _show = show;
show = function (id) { _show(id); setTimeout(() => renderRead(), 0); };

// ---------- v2: the end: Kube's read vs you ----------
async function endShow() {
  log("end"); show("s-end");
  while (readBusy) await new Promise((ok) => setTimeout(ok, 200));
  if (!S.read || S.read.trigger !== "teach") await updateRead("end");
  const r = S.read, selfW = ["Not really", "Kind of", "Sure"], selfP = [20, 55, 90];
  const rows = IDEAS.map((x) => {
    const sv = S.self[x.id], kc = r.conf[x.id], tb = S.teach ? S.teach.got.includes(x.id) : null;
    const off = sv != null && Math.abs(selfP[sv] - kc) >= 40;
    return `<tr><td>${x.id} · ${esc(x.short)}</td><td class="n">${sv != null ? selfW[sv] : "—"}</td><td class="n">${kc}%</td><td class="n">${tb == null ? "—" : tb ? "✓" : "missing"}</td><td>${off ? `<span class="gap">${selfP[sv] > kc ? "you feel surer than Kube" : "Kube is surer than you"}</span>` : ""}</td></tr>`;
  }).join("");
  const c = readCols(r);
  $("end-card").innerHTML = `<p class="eyebrow">Part 1 done</p><h2>What Kube thinks you know</h2>
    <p class="muted" style="margin:0">${live() ? "You saw this build up as you went. Here's where it landed." : "Kube was keeping track the whole time. This is the first time you're seeing it."}</p>
    <p style="margin:8px 0 0">Kube's read of your energy at the end: <b>${esc(S.E.label)}</b> (${S.E.score}/100)${S.esnaps.length ? `. Along the way: ${S.esnaps.map((e) => esc(e.label)).join(" → ")}` : ""}.</p>
    <table class="cmp"><thead><tr><th>Idea</th><th>You said</th><th>Kube's confidence</th><th>Teach-back</th><th></th></tr></thead><tbody>${rows}</tbody></table>
    <div class="end-cols"><div class="read">${c.left}</div><div class="read r">${c.right}</div></div>
    <div class="selfrate" id="end-q"><p>${live() ? "Did seeing Kube's read while you learned help?" : "Does this match what you thought you knew?"}</p><div class="row">${(live() ? ["It helped", "Didn't notice it", "It distracted me"] : ["Yes", "Partly", "No, it surprised me"]).map((t, i) => `<button class="btn ghost" data-k data-fb="${i}" ${i === 0 ? "data-rec" : ""}>${t}</button>`).join("")}</div></div>
    <div class="row" style="margin-top:16px"><button class="btn ghost" data-k id="end-dl">Download this run's data</button><button class="btn ghost" data-k id="end-map">← Back to the map</button><span class="saved" id="saved"></span></div>`;
  $("end-card").querySelectorAll("[data-fb]").forEach((b) => b.addEventListener("click", () => { S.feedback = b.textContent; log("feedback", { v: S.feedback }); $("end-q").innerHTML = `<p>Thanks: “${esc(S.feedback)}”.</p>`; saveRun(true); ring($("end-dl")); }));
  $("end-dl").addEventListener("click", downloadRun); $("end-map").addEventListener("click", () => { show("s-map"); renderMap(); });
  saveRun(true); KB.cur = null; setTimeout(ringDefault, 60);
}

// ---------- v2: saving each run ----------
function runData() {
  return { v: "part1-v10", pics: { mode: PICS_MODE, log: S.picLog }, warmup: S.warm, energy: S.E, energySnaps: S.esnaps, signals: { answers: S.sig.answers, choices: S.sig.choices, skims: S.sig.skim.length }, terms: S.terms, guesses: S.ans, run: RUN.id, group: S.group, groupFrom: S.groupFrom, started: new Date(RUN.started).toISOString(), ms: Date.now() - RUN.started,
    ua: navigator.userAgent.slice(0, 120), screen: `${innerWidth}x${innerHeight}`, pre: S.pre, talkKnown: S.known, done: S.done, self: S.self, teach: S.teach, feedback: S.feedback,
    finalRead: S.read, snaps: S.snaps, evidence: S.ev, events: LOG.slice(-400).map((e) => ({ ...e, t: e.t - RUN.started })) };
}
let dbP = null, saveT = null;
function saveRun(now) {
  clearTimeout(saveT); saveT = setTimeout(async () => {
    try {
      if (!window.claude || typeof window.claude.use !== "function") { if ($("saved")) $("saved").textContent = "Not saved here: use Download."; return; }
      if (!dbP) dbP = (async () => { const db = await claude.use("db"), user = await claude.use("user"); return db && user ? { db, uid: await user.id() } : null; })();
      const d = await dbP;
      if (!d || !d.uid) { S.saveErr = "no user id"; if ($("saved")) $("saved").textContent = "Not saved here: use Download."; return; }
      await d.db.doc(`runs/${d.uid}/runs/${RUN.id}`).set(JSON.parse(JSON.stringify(runData())));
      S.saveErr = null; if ($("saved")) $("saved").textContent = "Saved for Aneesh's study.";
    } catch (e) { S.saveErr = (e && (e.code || e.message)) || "error"; log("save-fail", { err: S.saveErr }); if ($("saved")) $("saved").textContent = `Couldn't save (${S.saveErr}): use Download.`; }
  }, now ? 50 : 4000);
}
async function downloadRun() {
  const data = JSON.stringify(runData(), null, 2), name = `part1-run-${RUN.id}.json`;
  try { const dl = window.claude && claude.use ? await claude.use("downloads") : null; if (dl) { await dl.save({ filename: name, data }); log("download"); return; } } catch (e) { if (e && e.code && e.code !== "unavailable") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = name; a.click();
}

// ---------- v5: keys first, then a real choice: warm-up questions, or straight to learning ----------
function keysStart() {
  show("s-keys"); $("keys-face").innerHTML = FACE("talk"); setTimeout(() => { $("keys-face").innerHTML = FACE("smile"); }, 1200);
  const K = (k) => `<kbd>${k}</kbd>`;
  $("keys-body").innerHTML = `<div class="klist">
    <div><span>${K("←")}${K("↑")}${K("→")}${K("↓")}</span><p>Move the orange ring</p></div>
    <div><span>${K("Enter")}</span><p>Choose what's ringed</p></div>
    <div><span>${K("Esc")}</span><p>Back out</p></div>
    ${live() ? `<div><span>${K("R")}</span><p>Open Kube's read of you</p></div>` : ""}
    <div><span>${K("Aa")}</span><p>In an answer box: type${micOk() ? " or talk" : ""}. ${K("Enter")} sends, ${K("↓")} leaves the box.</p></div></div>
    <div class="row"><button class="btn" data-k id="keys-ok" data-rec>Got it →</button></div>`;
  $("keys-ok").addEventListener("click", keysChoice);
}
function keysChoice() {
  log("keys-ok");
  $("keys-body").innerHTML = `<p class="kq">Want a few warm-up questions first?</p><p class="muted" style="margin:0 0 14px">Up to 3. Kube uses them to skip what you already know. No score.</p>
    <div class="row"><button class="btn" data-k id="warm-yes" data-rec>Yes, ask me</button><button class="btn ghost" data-k id="warm-no">Straight to learning</button></div>`;
  $("warm-yes").addEventListener("click", () => { S.warm = true; choice("warmup", 1); talkStart(); });
  $("warm-no").addEventListener("click", () => { S.warm = false; choice("warmup", -1); log("talk-skip", { n: 0 }); shipStart(); });
  KB.cur = null; setTimeout(ringDefault, 40);
}

// ---------- v5: Kube's read of your energy ----------
// Aneesh (Oct 27): like Kube's read of what you know, keep a read of how into it you are, from how you answer and move,
// and use it to tailor the checks and follow-ups. Signals: answer length, "I don't know"s, rushed answers, quiet time,
// key/mouse activity, extras taken or skipped, clicking through cards fast.
function act() { S.sig.acts.push(Date.now()); if (S.sig.acts.length > 400) S.sig.acts.splice(0, 200); }
function choice(kind, v) { S.sig.choices.push({ t: Date.now() - RUN.started, kind, v }); log("choice", { kind, v }); tickEnergy(); }
function energy() {
  const now = Date.now(), why = []; let sc = 55;
  const A = S.sig.answers.slice(-3);
  if (A.length) {
    const said = A.filter((a) => !a.idk), w = said.length ? said.reduce((s, a) => s + a.words, 0) / said.length : 0, idk = A.length - said.length;
    if (w >= 12) { sc += 15; why.push("long answers"); } else if (w >= 5) { sc += 6; why.push("real answers"); } else if (said.length) { sc -= 8; why.push("very short answers"); }
    if (idk >= 2) { sc -= 12; why.push(`${idk} “I don't know”s lately`); }
    if (said.filter((a) => a.ms < 5000 && a.words < 4).length >= 2) { sc -= 6; why.push("rushed answers"); }
  }
  const C = S.sig.choices.slice(-6), yes = C.filter((c) => c.v > 0).length, no = C.filter((c) => c.v < 0).length;
  if (yes) { sc += Math.min(15, yes * 5); why.push(`took ${yes} optional extra${yes > 1 ? "s" : ""}`); }
  if (no) { sc -= Math.min(15, no * 5); why.push(`skipped ${no} extra${no > 1 ? "s" : ""}`); }
  if (S.sig.skim.filter((t) => now - t < 120000).length >= 3) { sc -= 10; why.push("clicking through fast"); }
  const core = sc, idle = now - lastAct, busy = S.sig.acts.filter((t) => now - t < 60000).length;
  if (idle > 45000) { sc -= 22; why.unshift(`quiet for ${Math.round(idle / 1000)} s`); }
  else if (idle > 20000) { sc -= 8; why.unshift("paused"); }
  else if (busy >= 30) { sc += 6; why.push("lots of key/mouse activity"); }
  sc = Math.max(5, Math.min(95, Math.round(sc)));
  return { score: sc, core, label: sc >= 70 ? "Into it" : sc >= 40 ? "Steady" : sc >= 25 ? "Fading" : "Checked out", why: why.slice(0, 3) };
}
const pace = () => S.E.score >= 70 ? "high" : S.E.score >= 40 ? "mid" : "low";
const POLICY = { high: "offers the extras first: a guess, then why.", mid: "asks before any follow-up.", low: "keeps it short: no extras, hints up front, fewer nudges." };
function energyHTML() {
  const E = S.E, p = pace();
  return `<h3>Kube's read of your energy</h3><div class="e-row"><span class="e-lab ${p}">${esc(E.label)}</span><span class="b"><i style="width:${E.score}%"></i></span><span class="e-n">${E.score}</span></div>
    <p class="e-why">${E.why.length ? esc(E.why.join(" · ")) : "Nothing to go on yet."}</p><p class="e-do"><b>So Kube</b> ${POLICY[p]}</p>${S.read && S.read.energy ? `<p class="e-why">Kube: “${esc(S.read.energy)}”</p>` : ""}`;
}
function paintEnergy() {
  document.querySelectorAll("[data-energy]").forEach((e) => { e.innerHTML = energyHTML(); });
  document.querySelectorAll("[data-energy-mini]").forEach((e) => { e.textContent = `Energy: ${S.E.label}`; });
}
function tickEnergy() {
  const old = S.E, E = S.E = energy();
  if (E.label !== old.label) { S.esnaps.push({ t: Date.now() - RUN.started, score: E.score, label: E.label, why: E.why }); log("energy", { score: E.score, label: E.label }); }
  if (E.score !== old.score || E.why.join() !== old.why.join()) paintEnergy();
  // one gentle note when energy really dips (not just a pause to read)
  const typing = document.activeElement && document.activeElement.tagName === "TEXTAREA";
  if (E.score < 40 && E.core < 45 && !S.dipSaid && (!$("s-map").hidden || S.sub) && $("drill").hidden && $("wordcard").hidden && Date.now() > kubeBusyUntil && !typing) {
    S.dipSaid = true; log("dip", { score: E.score });
    kubeSay("Energy's dipping, so I'll keep it short: no extra questions unless you ask. A break is fine too.", [{ label: "Thanks", fn: () => {} }, { label: "I'm fine", fn: () => choice("dip", 1) }], 12000, "talk");
  }
}
setInterval(tickEnergy, 2000);
setInterval(() => {
  if (!S.sub || typeof S.sub.on !== "number" || S.sub.on < 0 || !$("pic") || !$("pic").hidden) return;
  if (Date.now() - lastAct > 25000 && Date.now() - (S.sub.cardAt || 0) > 25000) {
    $("pic").hidden = false; $("pic").insertAdjacentHTML("afterend", `<p class="pic-why">${PIC_NOTE.linger}</p>`);
    const b = document.querySelector("[data-showpic]"); if (b) b.remove();
    S.picLog.push({ t: Date.now() - RUN.started, idea: S.sub.id, card: S.sub.on, shown: true, why: "linger" }); log("pic-linger", { id: S.sub.id, i: S.sub.on });
  }
}, 2000);

// ---------- v5: word checks. A fuzzy definition gets drilled: say it, see it broken into parts, say it again ----------
const an = (w) => (/^[aeiou]/i.test(w) ? "an " : "a ") + w.toLowerCase();
function offerDrill() {
  if (!$("drill").hidden || !$("wordcard").hidden || !$("read-pop").hidden || Date.now() < kubeBusyUntil) return;
  if (document.activeElement && document.activeElement.tagName === "TEXTAREA") return;
  if ($("s-map").hidden || S.sub) return; // only on the map, never in the middle of something
  const w = Object.keys(S.terms).find((k) => S.terms[k].s !== "ok" && !S.drillOffered.has(k) && DRILL[k]);
  if (!w) return; S.drillOffered.add(w);
  const t = S.terms[w]; log("drill-offer", { w });
  kubeSay(`“${WORDS[w].w}” looks fuzzy${t.quote ? `: you said “${clip(t.quote, 60)}”` : ""}. Quick word check?`, [{ label: "Check the word", fn: () => { choice("drill", 1); openDrill(w, "ask"); } }, { label: "Later", fn: () => choice("drill", -1) }], 14000, "talk");
}
function openDrill(w, mode, then) {
  const W = WORDS[w]; S.drill = { w, mode, then: then || null, tries: 0 }; log("drill", { w, mode }); kubeHide();
  $("drill").hidden = false;
  $("drill").innerHTML = `<div class="drill-in"><p class="eyebrow">Word check</p><h3>${esc(W.w)}</h3><div id="drill-body"></div></div>`;
  if (mode === "show") drillParts(null); else drillAsk();
}
function drillAsk() {
  const W = WORDS[S.drill.w];
  $("drill-body").innerHTML = `<p class="line">${S.drill.tries || S.drill.mode === "show" ? "Now say it in your own words." : `In your own words: what's ${esc(an(W.w))}?`}</p>${answerBox("drill", "A few words…", S.drill.tries || S.drill.mode === "show" ? `<button class="btn ghost" data-k id="drill-close">Later</button>` : `<button class="btn ghost" data-k id="drill-show">Show me first</button>`)}`;
  wireAnswer($("drill-body"), drillAnswer);
  if ($("drill-show")) $("drill-show").addEventListener("click", () => { S.drill.mode = "show"; drillParts(null); });
  if ($("drill-close")) $("drill-close").addEventListener("click", closeDrill);
}
function drillParts(res) {
  const w = S.drill.w, W = WORDS[w], D = DRILL[w], ok = res && res.verdict === "ok";
  const parts = D.parts.map((p, i) => `<div class="part ${res ? (res.covered.includes(i) ? "y" : "n") : ""}" style="animation-delay:${i * 0.15}s"><i>${res ? (res.covered.includes(i) ? "✓ you said it" : "missing") : `part ${i + 1}`}</i>${esc(p)}</div>`).join(`<span class="plus">+</span>`);
  $("drill-body").innerHTML = `${res ? `<p class="verdict ${ok ? "ok" : res.verdict === "shaky" ? "half" : "no"}">${ok ? "✓ You've got the word" : res.verdict === "shaky" ? "Part of it" : "Not yet"}</p>${res.say ? `<p class="line small">${esc(res.say)}</p>` : ""}` : `<p class="line small">${esc(W.w)} is made of three parts:</p>`}
    <div class="eq">${parts}<span class="plus">=</span><div class="part w">${esc(W.w)}</div></div>
    ${PIC[W.pic] ? `<div class="pic">${PIC[W.pic]()}</div>` : ""}
    <p class="notmix"><b>Don't mix it up:</b> ${esc(D.not)}</p>${res && res.mixed ? `<p class="notmix">${esc(res.mixed)}</p>` : ""}
    <div class="row">${!res ? `<button class="btn" data-k id="drill-say" data-rec>Now say it in your words</button><button class="btn ghost" data-k id="drill-close">Got it, back</button>`
      : ok || S.drill.tries >= 2 ? `<button class="btn" data-k id="drill-close" data-rec>Got it →</button>` : `<button class="btn" data-k id="drill-say" data-rec>Say it again</button><button class="btn ghost" data-k id="drill-close">Back</button>`}</div>`;
  if ($("drill-say")) $("drill-say").addEventListener("click", drillAsk);
  $("drill-close").addEventListener("click", () => { if (!res) choice("drill", -1); closeDrill(); });
  KB.cur = null; setTimeout(() => ring($("drill-body").querySelector("[data-rec]") || $("drill-close")), 40);
}
async function drillAnswer(t, idk) {
  const w = S.drill.w, W = WORDS[w], D = DRILL[w]; S.drill.tries++;
  $("drill-body").innerHTML = `<p class="thinking">Kube is checking…</p>`;
  let r = idk ? null : await askClaude(`You are Kube, a friendly tutor. A beginner is explaining the word "${W.w}" (from a lesson on why Kubernetes exists) in their own words.
Definition: ${W.p}
Its parts (index: part): ${D.parts.map((p, i) => `${i}: ${p}`).join("; ")}
A common mix-up: ${D.not}
They said: """${t}"""
Which parts did they get across (rough wording is fine)? Did they mix it up with another word?
Reply JSON only: {"covered": [indices], "mixed": "if they mixed it up with something, max 16 words, plain; else empty", "say": "max 16 words, warm, building on their words"}`);
  if (!r || !Array.isArray(r.covered)) r = { covered: idk ? [] : D.kw.map((re, i) => (re.test(t) ? i : -1)).filter((i) => i >= 0), mixed: "", say: "" };
  r.covered = r.covered.map(Number).filter((i) => D.parts[i]);
  r.verdict = r.covered.length === D.parts.length ? "ok" : r.covered.length ? "shaky" : "unknown";
  S.terms[w] = { s: r.verdict, quote: idk ? "" : t.slice(0, 120), by: "drill" };
  log("drill-answer", { w, verdict: r.verdict, tries: S.drill.tries }); ev({ where: "drill", word: w, q: `What's ${an(W.w)}?`, a: idk ? "" : t, idk, verdict: r.verdict }); updateRead("drill");
  drillParts(r);
}
function closeDrill() {
  if (!S.drill) { $("drill").hidden = true; return; }
  const then = S.drill.then; S.drill = null; $("drill").hidden = true; $("drill").innerHTML = ""; KB.cur = null; renderRead();
  if (!$("s-map").hidden && !S.sub) renderMap();
  if (then) then(); else ringDefault();
}

show("s-start");
window.__p1 = { markAnswer, S, IDEAS, LOG, openSub, teachStart, mapStart, endShow, runData, updateRead, openDrill, energy, tickEnergy, pace };
</script>
